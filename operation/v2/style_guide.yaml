# Colour and type style shared by the v2 figures (operation/v2/paper_scripts/*).
# Scripts load this file and refer to slots by name, so a palette change happens here once.

font: Gill Sans            # macOS system font; falls back to sans-serif when absent

ink:
  primary: "#0b0b0b"       # titles, value labels, category labels
  muted: "#7f8a9c"         # axis titles, tick numbers; cool grey between slate and slate_light
  grid: "#e1e0d9"          # hairline gridlines
  baseline: "#c3c2b7"      # axis spines
  surface: "#ffffff"       # figure and axes background; also the gap between stacked segments
  unknown: "#c3c2b7"       # any category the palettes below do not name
  slate: "#5b6b84"         # secondary text next to the blue ramp (counts, notes, "not covered")
  slate_light: "#b9c3d2"   # empty markers and hairlines in the same slate family

# tasks.human_difficulty_measure, easiest -> hardest: one blue ramp, light -> dark.
# Ordinal ramp validated against the light surface (dataviz validate_palette.js --ordinal).
difficulty:
  Easy: "#86b6ef"
  Medium: "#3987e5"
  Medium-Hard: "#1c5cab"
  Hard: "#0d366b"

# Model vendors, brand hue where one exists (plot_leaderboard.py). Bars carry the agent name, so identity never rests on hue alone.
# Validated with dataviz validate_palette.js --pairs all: xAI takes ink.slate because its brand is black; Anthropic/OpenAI sit at CVD dE 6.8.
company:
  Anthropic: "#d97757"    # terracotta
  OpenAI: "#10a37f"       # green
  Google: "#4285f4"       # blue
  xAI: "#5b6b84"          # slate, same as ink.slate
  Moonshot: "#c2418f"     # magenta
  Alibaba: "#7c3aed"      # violet

# Harness on the leaderboard bars: share of the vendor hue mixed toward the surface (plot_leaderboard.py adds a hatch too).
harness_tint:
  GUI: 0.0
  Excel: 0.14
  Code: 0.28
  In-house: 0.42

# Categorical slots in fixed order for future multi-series figures (assign by entity, never cycle).
categorical:
  - "#2a78d6"              # blue
  - "#eb6834"              # orange
  - "#1baf7a"              # aqua
  - "#eda100"              # yellow
  - "#e87ba4"              # magenta
  - "#008300"              # green
  - "#4a3aa7"              # violet
  - "#e34948"              # red
