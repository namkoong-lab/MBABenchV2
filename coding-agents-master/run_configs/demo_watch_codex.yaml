# Live-watch demo: Codex demo on the toy task (gpt-5.4 - prior-wave model, not Sol, per no-frontier-tests rule).
# External mode -> no DB/S3 writes. Costs pennies, runs a few minutes.
run_name: demo_watch_codex
mode: external
identity: external/demo-watch-codex
agent:
  cli: codex
  model: gpt-5.4
  effort: medium
  extra_args: []
  env: {}
template_version: v7
sandbox:
  mode: docker
  image: mbabench-coding-agent:v1
limits:
  wall_clock_seconds: 1800
  junk_seconds: 180
