# External-mode example: run YOUR OWN task with YOUR OWN key. No MBABench
# database, S3, or credentials involved; results land in a local folder.
#
# Task folder layout:
#   my_task/
#     task.yaml            (task_name: ...; task_source: fmwc|modeloff|wsp|jp)
#     starting_files/      (your input .xlsx/.pdf files)
#
# Usage:
#   export ANTHROPIC_API_KEY=...   (or OPENAI_API_KEY for a codex identity)
#   python -m coding_agent.run_task --config run_configs/example_external.yaml \
#       --task-dir ./my_task --results-dir ./results
#
# agent_model_name must be a label registered in coding_agent/agent_identities.yaml
# (it pins cli/model/effort). In external mode it is only written into
# summary.json — the results folder is named <task_name>_<timestamp>_<pid>.
# Register a new entry there to run a different cli/model/effort.
mode: external
benchmark: v2                   # v2 = the MBABenchV2 experiment (v13 template, pv 113); v1 = BizbenchV1 (v7 template)
agent_model_name: claudecode_anthropic/claude-fable-5-max
# template_version: v13         # optional override; the default follows `benchmark`
# sandbox:
#   image: mbabench-coding-agent:v2   # tag must match the identity: default :v2, Forge (codex_tensorblock/*) :v3, Opus 5.5 :v4 — see README "Identities"
