# v2 - task CorpBondII (id 11) on Claude Haiku 4.5, pipeline shakeout.
#
#   python -m coding_agent.run_task --config run_configs/example_v2_claude.yaml --task-id 11
#
# benchmark: v2 selects everything together: the MBABenchV2 DB
# (database.v2_url in <MBABenchV2>/config/config.yaml), the
# s3://mbabench/MBABenchV2/ root, and the v12 template (the v2 132-check
# rubric mirror + the Questions-sheet answer convention + the House
# Standards directive, generated by tools/build_v12_template.py ->
# prompt_version 112). v12 itself seeds <MBABenchV2>/house_standards/
# House_Standards_v1.md into the workspace's starting_files/ — a run
# config never names the file, so prompt_version and the standards the
# agent saw cannot disagree. The identity's settings plus
# house_standards {version, file, sha256} land in task_attempts.extra_configs.
# template_version: v9 reproduces the pre-standards prompt (109); v10/v11 (110/111)
# are the frozen rubric-scrubbed experiment templates of 2026-09-08.
#
# Grade v2 attempts with the agentic judge + rubric_9 (see
# judge/project_configs.yaml).
mode: internal
benchmark: v2
agent_model_name: claudecode_anthropic/claude-haiku-4-5   # cheap; never burn frontier budget on smoke
