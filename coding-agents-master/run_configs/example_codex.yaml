# Internal-mode example: Codex on GPT-5.6 Sol at xhigh (the API maximum —
# the ChatGPT UI's "Ultra" label does not exist as an API value).
# Usage: python -m coding_agent.run_task --config run_configs/example_codex.yaml --task-id 83
# Secrets from env/.env: OPENAI_API_KEY, DATABASE_URL (+ AWS creds via env or ~/.aws).
run_name: codex_example
mode: internal
identity: codex_openai/gpt-5.6-sol-xhigh
agent:
  cli: codex
  model: gpt-5.6-sol
  effort: xhigh
  extra_args: []
  env: {}
template_version: v6
sandbox:
  mode: docker
  image: mbabench-coding-agent:v1
  cpus: 4
  memory: 8g
limits:
  wall_clock_seconds: 14400
  junk_seconds: 180
internal:
  s3_bucket: mbabench
  s3_root: BizbenchV1
