# Agent identity registry — THE place that defines what a cohort name means.
#
# A run config names its cohort with ONE key, agent_model_name (the value
# written to task_attempts.agent_model_name and used as the S3 prefix), and
# nothing else about the agent. The entry here for that label supplies every
# setting that changes what the agent does; the runner builds its agent
# command from them and refuses to start if the config carries an `agent:`
# block or any of these keys itself (one source of truth):
#
#   cli          claude | codex — which vendor CLI runs the attempt
#   model        vendor model id passed to the CLI's --model
#   effort       claude: --effort low|medium|high|xhigh|max; codex:
#                -c model_reasoning_effort=...; null when not pinned
#   extra_args   extra CLI flags (rung-0 corrections live here, not in code)
#   env          extra env vars injected into the sandbox (no secrets)
#
# Underneath every entry the harness applies its own long-turn defaults
# (coding_agent/agents.py: CLAUDE_HARNESS_ENV for claude, per-provider
# stream/retry settings for codex) and records them per row as
# extra_configs.harness_defaults; an entry's env / extra_args override them.
#
# An unknown label refuses to run and prints a ready-to-paste stanza. All
# five settings are written to task_attempts.extra_configs (JSONB,
# MBABenchV2 only; the BizbenchV1 table has no such column) on every upload,
# together with the sandbox image, so a row records the exact settings it
# ran under and can be audited later without trusting this file.
#
# Existing entries should normally not change. agent_model_name is what
# identifies a group of runs: the judge, get_results and the paper tables all
# group rows by it and assume every row under a label ran with the same
# settings. Edit an entry's other fields only with the explicit intent that
# the new runs be grouped with the existing ones under that label. Otherwise
# add a new entry with a new label.
#
# Rules, enforced at load: every agent_model_name unique; every
# (cli, model, effort) combination unique; every field above present on
# every entry.

# v1 wave cohorts (BizbenchV1 rows exist under these labels).
- agent_model_name: claudecode_anthropic/claude-fable-5-max
  cli: claude
  model: claude-fable-5
  effort: max
  extra_args: []
  # 2026-08-30 mid-wave (Pat): raise Claude Code's default 64k output cap —
  # it terminally failed ~7 wave attempts — and lengthen the per-request
  # timeout (terminal "Request timed out" killed ~6 more; value matches the
  # haiku entry). Rows before/after distinguishable via extra_configs.env.
  env:
    CLAUDE_CODE_MAX_OUTPUT_TOKENS: "128000"
    API_TIMEOUT_MS: "3600000"

- agent_model_name: codex_openai/gpt-5.6-sol-xhigh
  cli: codex
  model: gpt-5.6-sol
  effort: xhigh
  extra_args: []
  env: {}

# Cheap pipeline-shakeout cohort; never a paper cohort.
- agent_model_name: claudecode_anthropic/claude-haiku-4-5
  cli: claude
  model: claude-haiku-4-5-20251001
  effort: null
  extra_args: []
  env:
    CLAUDE_CODE_MAX_OUTPUT_TOKENS: "128000"
    API_TIMEOUT_MS: "3600000"

# ---------------------------------------------------------------------------
# 2026-09-10: the 101-task MBABenchV2 rerun cohorts. Live-probed the same day:
#
#   claude-fable-5-1  listed by Anthropic /v1/models (128000 output ceiling);
#                     output_config.effort accepts low/medium/high/xhigh/max
#                     ("max" accepted on a live request). Claude Code's
#                     --effort takes the same ladder (verified 2.1.223 in
#                     agents.py), so max is the top tier here too. Same env
#                     as the fable-5-max entry (128k output cap, 1h request
#                     timeout — the mid-wave fixes) so the two Claude Code
#                     cohorts differ only in model.
#   gpt-6-astra       listed by OpenAI /v1/models; the Responses API accepts
#                     reasoning.effort up to "max", but Codex's own config
#                     enum for model_reasoning_effort is
#                     minimal|low|medium|high|xhigh (config reference,
#                     2026-09-10), so xhigh is the top tier reachable through
#                     the Codex CLI. If a rung-0 run shows a newer Codex
#                     accepting "max", register a separate -max entry rather
#                     than editing this one.
- agent_model_name: claudecode_anthropic/claude-fable-5-1-max
  cli: claude
  model: claude-fable-5-1
  effort: max
  extra_args: []
  env:
    CLAUDE_CODE_MAX_OUTPUT_TOKENS: "128000"
    API_TIMEOUT_MS: "3600000"
    # 2026-09-11 (Pat, in-place env edit like the fable-5 entry on 08-30 —
    # rows before/after distinguishable via extra_configs.env). The 10-task
    # rubric-coverage run lost 4 of 10 tasks (28, 41, 43, 48) to one shape:
    # Fable 5.1 at max effort thinks silently for >5 min on a hard step,
    # Claude Code's stream watchdog (300 s without an event / 180 s without a
    # byte) aborts the stream, retries the same turn, then falls back to
    # NON-streaming requests capped at max_tokens 64000 that die at ~11 min,
    # and after 10 retries reports "Request timed out" with no workbook
    # (relay trajectories: drops at 6-17 min while thinking deltas were
    # flowing). Fable 5 streamed a delta every ~1 s and its 29-min turns
    # survived the same stack. Settings per code.claude.com/docs/en/
    # network-config.md and errors.md: wait through 30 min of silence (the
    # documented cap), never take the non-streaming fallback, retry up to
    # the 15 cap. Present in Claude Code 2.1.260; the image pins 2.1.251.
    # The same values are now the harness default for every claude run
    # (agents.CLAUDE_HARNESS_ENV); kept explicit here as this entry's pin.
    CLAUDE_STREAM_IDLE_TIMEOUT_MS: "1800000"
    CLAUDE_BYTE_STREAM_IDLE_TIMEOUT_MS: "1800000"
    CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK: "1"
    CLAUDE_CODE_MAX_RETRIES: "15"

- agent_model_name: codex_openai/gpt-6-astra-xhigh
  cli: codex
  model: gpt-6-astra
  effort: xhigh
  extra_args: []
  env: {}
