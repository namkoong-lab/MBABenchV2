# Agent identity registry — THE place that defines cohort names.
#
# An attempt's DB label (task_attempts.agent_model_name) is resolved from the
# four axes that define a cohort:
#
#   model                   the API model id from the batch config
#   reasoning_effort        null for models that don't take it
#   thinking_budget_tokens  null for models that don't take it
#   max_completion_tokens   as the executor applies it (config value, or the
#                           8000 default when the config omits the key)
#
# A batch config no longer names its cohort (agent_folder is retired): the
# runner looks up the exact axis combination here. No entry -> the run
# refuses to start and prints a ready-to-paste stanza for the new combo, so
# a settings change can never silently reuse an old cohort's label.
#
# Each entry also carries the base_url the agent runs against — provider
# routing keys off base_url, not the model name, so pinning it here is what
# stops a Claude model from silently taking the OpenAI code path. The runner
# applies the registry's base_url; a batch config may repeat it, but a
# conflicting value refuses to run.
#
# Rules, enforced at load: every agent_model_name unique; every axis
# combination unique; base_url required.

- agent_model_name: openpyxl_anthropic/claude-fable-5-max
  model: claude-fable-5
  reasoning_effort: max
  thinking_budget_tokens: null
  max_completion_tokens: 128000
  base_url: https://api.anthropic.com

- agent_model_name: openpyxl_anthropic/claude-sonnet-5-xhigh
  model: claude-sonnet-5
  reasoning_effort: xhigh
  thinking_budget_tokens: null
  max_completion_tokens: 64000
  base_url: https://api.anthropic.com

- agent_model_name: openpyxl_anthropic/claude-haiku-4-5-think16k
  model: claude-haiku-4-5
  reasoning_effort: null
  thinking_budget_tokens: 16000
  max_completion_tokens: 32000
  base_url: https://api.anthropic.com

- agent_model_name: openpyxl_openai/gpt-5.2-none
  model: gpt-5.2
  reasoning_effort: none
  thinking_budget_tokens: null
  max_completion_tokens: 64000
  base_url: https://api.openai.com/v1

- agent_model_name: openpyxl_openai/gpt-4o-mini
  model: gpt-4o-mini
  reasoning_effort: null
  thinking_budget_tokens: null
  max_completion_tokens: 16000
  base_url: https://api.openai.com/v1
