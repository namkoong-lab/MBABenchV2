# SMOKE TEST: the Gemini 3.8 Flash cohort config restricted to task 1 (about $3, ~15 min).
# Proves the offline chain end to end: bundle -> model -> outputs/. Grade it afterwards with the judge (REPRODUCE.md, section 2).
# openpyxl_tensorblock/gemini-3.8-flash-high — the CLI leaderboard cohort, offline.
#
# One of the seven configs in this folder: one per cohort on the openpyxl/MCP
# CLI leaderboard, all 101 tasks, reading the bundled inputs and writing into
# outputs/. They differ from each other in one line — agent_model_name — and
# from the lane configs the recorded wave ran under only in that those split
# the same 101 ids across parallel lanes and read/wrote the database and the
# object store. Everything that reaches the model is identical, including this
# cohort's provider-specific system prompt variant
# (prompts/system_prompt_v16_gemini-3.8-flash.txt, selected for this model id by
# MODEL_SYSTEM_PROMPT_VARIANTS in excel_cli_agent/prompt_versions.py) and its
# function-calling request path; tests/test_offline_parity.py asserts the
# recorded bytes.

batch_name: "offline - openpyxl_tensorblock/gemini-3.8-flash-high - task 1 only, smoke test (v16)"
auto_mode: true

# The cohort label is the ONLY model key. Its entry in
# excel_cli_agent/agent_identities.yaml supplies model (tensorblock/gemini-3.8-flash),
# reasoning_effort (high), max_completion_tokens, base_url (TensorBlock Forge),
# fresh_context_mode, enhanced_excel_context and recent_history_count;
# setting any of them here refuses to run, so every row under this label ran
# with the same settings. They are recorded on each attempt row under
# extra_configs.
agent_model_name: "openpyxl_tensorblock/gemini-3.8-flash-high"

benchmark: "v2"

# Read the tasks from data/, write the attempts to outputs/ (data/README.md
# for both layouts). Stated explicitly rather than left to the fallback: a
# machine that does have a database URL configured would otherwise run this
# against the database, and the point of this folder is that it does not.
source: local
sink: local

# Pins both prompt files and the attachment (excel_cli_agent/prompt_versions.py):
#   v16 -> prompts/system_prompt_v16.txt
#        + prompts/task_template_shared_v9.txt
#        + house_standards/House_Standards_v1.md, delivered into the
#          workspace as HOUSE_STANDARDS.md and embedded in the context
# Recorded as prompt_version 1609 (system*100 + template) — the value every
# row on the CLI leaderboard carries. Pinned so a future default cannot
# silently move this cohort.
prompt_version: "v16"

# One attempt per task. With trials_since far in the past, every row already
# in outputs/ counts, so a relaunched run resumes rather than re-running
# what it finished.
max_trials: 1
trials_since: "2020-01-01"

task_ids: [1]

verbose: true

# The two run limits the recorded wave used, recorded on every attempt row
# under extra_configs. Hitting the iteration cap is NOT a failure: the row
# lands with agent_failed=false and reason "Max iterations (40) reached",
# and whatever solution.xlsx exists at that point is the graded workbook.
max_iterations: 40
api_timeout_seconds: 3600

cleanup_workspace: true
