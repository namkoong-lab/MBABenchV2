batch_name: "v1 vs v2 Comparison - v1 Agent"
# Only model key. The agent_identities.yaml entry supplies model (gpt-5.2),
# reasoning_effort (none), max_completion_tokens (64000), base_url (OpenAI
# direct) and the context flags; setting any of those here refuses to run.
agent_model_name: "openpyxl_openai/gpt-5.2-none"
auto_mode: true
benchmark: "v1"                   # BizbenchV1 DB + s3://mbabench/BizbenchV1/

workspace_base_dir: "./workspaces"

max_trials: 99
trials_since: "2020-01-01"
prompt_version: "v1"

tasks:
  - "Speed-It-Up-Finance-unhfuz"

verbose: true
enable_langfuse: false
max_iterations: 30
api_timeout_seconds: 300
cleanup_workspace: true
