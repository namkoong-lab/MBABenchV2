# Mini batch test — 3 tasks, 3 iterations each, cheap model
# Usage: excel-agent --batch-config examples/v1/test_mini_batch.yaml
#
# agent_model_name is the only model key: its agent_identities.yaml entry
# supplies model (gpt-4o-mini), max_completion_tokens (16000), base_url
# (OpenAI direct) and the context flags. Setting those here refuses to run.

batch_name: "mini-batch-test"
agent_model_name: "openpyxl_openai/gpt-4o-mini"
auto_mode: true
benchmark: "v1"                   # BizbenchV1 DB + s3://mbabench/BizbenchV1/

workspace_base_dir: "./workspaces"
max_iterations: 3
max_trials: 99
trials_since: "2020-01-01"
prompt_version: "v10"
cleanup_workspace: false

tasks:
  - "Speed-It-Up-Finance-unhfuz"
  - "Lifetime-Value"
  - "1.-1st-Year-Analyst-Fall-2022-fuw8gf"

api_timeout_seconds: 120
verbose: true
