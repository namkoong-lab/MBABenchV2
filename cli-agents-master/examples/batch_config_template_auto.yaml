# Auto Batch Config Template
# Automated pipeline: DB lookup -> trial check -> S3 download -> execute -> S3 upload -> DB entry
#
# Usage:
#   nohup excel-agent --batch-config my_auto_config.yaml > ~/my_run.log 2>&1 &

batch_name: "Auto Batch - MODEL_DISPLAY_NAME"
auto_mode: true

# Which agent to run (REQUIRED) — the cohort label written to
# task_attempts.agent_model_name, and the ONLY model key allowed here. Its
# entry in excel_cli_agent/agent_identities.yaml supplies model,
# reasoning_effort, thinking_budget_tokens, max_completion_tokens, base_url,
# fresh_context_mode, enhanced_excel_context and recent_history_count; the
# run refuses to start if any of those appear in this file, and refuses an
# unregistered label (printing the stanza to add). The resolved settings are
# recorded on every DB row in task_attempts.extra_configs. Need different
# settings? Usually add a new registry entry with a new label; edit an
# existing entry only if the new runs are meant to be grouped with the
# rows already under that label (see the registry header).
agent_model_name: "openpyxl_openai/gpt-5.2-none"

# Which experiment this run belongs to (REQUIRED):
#   v1 -> BizbenchV1 DB, s3://mbabench/BizbenchV1/..., v1-rubric prompts
#   v2 -> MBABenchV2 DB, s3://mbabench/MBABenchV2/..., v2-rubric prompts (v12)
# This key selects the database on its own: database.v1_url / v2_url in
# <MBABenchV2>/config/config.yaml — no DATABASE_URL swapping in .env.
# (DATABASE_URL remains the fallback for standalone runs, and is
# sanity-checked against the benchmark at startup.) prompt_version (below)
# defaults from the benchmark; an explicit value must embed the same
# benchmark's rubric (v1..v11 = the 17-check v1 rubric, v12 = the 132-check
# v2 rubric) or the run refuses to start. EXCEL_AGENT_SKIP_RUBRIC_GUARD=1
# forces a deliberate cross-benchmark run.
benchmark: "v1"

# Where to create workspaces (files downloaded from S3 here). Optional:
# omit to use the batch's own logs dir, batch_logs/batch_{ts}/workspaces/
# workspace_base_dir: "~/auto_batch_MODEL_NAME"  # ~ is expanded automatically

# Pin the prompt set explicitly. One key selects BOTH files (registry:
# excel_cli_agent/prompt_versions.py, files: excel_cli_agent/prompts/):
#   v10 -> system_prompt_v10.txt + task_template_fmwc_v4.txt / _wsp_*  (v1 rubric)
#   v11 -> system_prompt_v11.txt + task_template_fmwc_v5.txt / _wsp_*  (v1 rubric)
#   v12 -> system_prompt_v12.txt + task_template_shared_v6.txt         (v2 rubric)
# Omitting it defaults from the benchmark (v1 -> v10, v2 -> v12). Recorded in
# the DB as system*100 + template (e.g. v11 = 1105).
prompt_version: "v11"

# Trials mode: max attempts per task+model combo
max_trials: 7                         # Skip if >= 7 attempts exist (default: 7)
trials_since: "2026-02-05"            # Only count attempts after this date (default: today)
                                      # Set to old date to count ALL attempts, or today to ignore v0

# --- Task Selection (pick ONE) ---

# Option A: Explicit task names (from DB tasks.task_name)
# tasks:
#   - "1.-1st-Year-Analyst-Fall-2022-fuw8gf"
#   - "Lifetime-Value"
#   - "MO13 Round 2 - Sec 2 - Mergers and Acquisitions"

# Option B: Auto-discover from DB (mutually exclusive with tasks:)
task_filter:
  task_source: "fmwc"               # optional: "fmwc", "modeloff", "wsp", or omit for all
  missing_for_model: true           # only tasks with < max_trials attempts for this model

# --- Run Settings (not part of the identity) ---
verbose: true
max_iterations: 10
api_timeout_seconds: 600
cleanup_workspace: true                   # Delete workspace after S3 upload (default: true)

# The task template is auto-selected per task from its task_source (fmwc/
# modeloff vs wsp) via PROMPT_VERSIONS in excel_cli_agent/prompt_versions.py;
# there is no per-config override.
