# Judge identity registry — what a grader_model label means.
#
# `--model <label>` resolves here (utils/judge_identity.py); the entry pins
# provider (endpoint), the wire model id, and the reasoning effort. Rules,
# enforced at load: label unique; (provider, model, effort) unique; every
# key present on every entry. Unknown label -> refusal + paste-ready stanza.
#
# Labels are the exact strings stored in gradings.grader_model, so re-grades
# under an existing label keep hitting the endpoint that label used.
# Seeded 2026-08-25 from SELECT DISTINCT grader_model FROM gradings on
# MBABenchV2 plus the labels attested in project_configs.yaml and
# _MODEL_PRICING (the v1 database was not reachable from this machine —
# add any missing v1-era label with its historical provider before
# re-grading under it).
#
# Policy (Pat, 2026-08-25): OpenAI grader models always use the OpenAI API
# directly — never register an openai/* label with provider: openrouter.

# Default grader (project_configs.yaml judge.default_grader).
- grader_model: google/gemini-2.5-pro
  provider: openrouter                # was in judge.openrouter_models
  model: google/gemini-2.5-pro
  effort: minimal

- grader_model: google/gemini-2.5-flash
  provider: openrouter                # was in judge.openrouter_models
  model: google/gemini-2.5-flash
  effort: minimal

# Fuzzy task search (operation_scripts/search_tasks.py), not a grader:
# called without reasoning_effort, hence null.
- grader_model: google/gemini-2.5-flash-lite
  provider: openrouter                # was in judge.openrouter_models
  model: google/gemini-2.5-flash-lite
  effort: null

- grader_model: google/gemini-3.5-flash
  provider: openrouter                # was in judge.openrouter_models
  model: google/gemini-3.5-flash
  effort: minimal

# Graded via Gemini-direct (never in openrouter_models).
- grader_model: google/gemini-3.5-flash-lite
  provider: gemini
  model: gemini-3.5-flash-lite
  effort: minimal

- grader_model: google/gemini-3-flash-preview
  provider: gemini
  model: gemini-3-flash-preview
  effort: minimal

# Judge-robustness study graders.
- grader_model: anthropic/claude-opus-4-8
  provider: anthropic
  model: claude-opus-4-8
  effort: null                        # anthropic path drops reasoning_effort

- grader_model: openai/gpt-5.5
  provider: openai
  model: gpt-5.5
  effort: none                        # only effort chat/completions accepts with tools

# Judge bake-off 2026-08, revised roster (Patrick 2026-08-31): the evaluation
# is gemini-3.7-flash @low vs @high vs gpt-5.6-sol; gemini-3.5-flash and
# claude-opus-5 arms are retired. 3.7-flash's effort scale is low / medium
# (provider default) / high — both our lanes set it explicitly, so neither
# rides the default. The stanza pins `low`; the high lane passes
# --reasoning-effort high, recorded in gradings.grader_reasoning.
- grader_model: google/gemini-3.7-flash
  provider: openrouter                # keeps OpenRouter's exact per-call cost
  model: google/gemini-3.7-flash
  effort: low

# Judge bake-off 2026-08 graders (judge_version 3; vs google/gemini-3.5-flash
# above). Minimal/lowest effort posture for all three — no reasoning-plumbing.
- grader_model: openai/gpt-5.6-sol
  provider: openai                    # policy: OpenAI graders never via openrouter
  model: gpt-5.6-sol
  effort: none                        # chat/completions accepts none/low/medium/high/xhigh; function tools force none anyway

- grader_model: anthropic/claude-opus-5
  provider: anthropic
  model: claude-opus-5
  effort: null                        # anthropic path drops reasoning_effort; Opus 5 thinking is always-on (its floor)

# Bake-off arm that was run (2026-08-31, judge_version 3, 64 rows) from a
# locally-edited registry and never committed — appended 2026-09-01 so the
# recommended grader is runnable again. Label string matches the existing
# gradings.grader_model EXACTLY so new rows join the old cohort. Both
# efforts share this one entry: high is the pinned default (the
# reproducibility recommendation); run low via --reasoning-effort low —
# gradings.grader_reasoning records the effective value either way.
- grader_model: google/gemini-3.7-flash
  provider: openrouter                # verified from the bake-off bundles'
                                      # _metadata.json grader_identity
  model: google/gemini-3.7-flash
  effort: high

# Judge-effort canary graders (2026-09-01). One label per model — the low/high
# arms run via --reasoning-effort overrides on the same label, recorded in
# gradings.grader_reasoning, so each model stays ONE grader population.
# Probed live with function tools before registration:
#   sol/terra tiers on the wire: none | low | medium | high | xhigh
#     ('minimal' and 'max' rejected; real tiers require /v1/responses —
#     utils/openai_responses.py routes those; 'none' stays chat/completions)
#   sonnet tiers via the compat endpoint: low | medium | high | xhigh | max
#     (honored, verified by token/latency deltas; Anthropic default is high)
- grader_model: openai/gpt-5.6-terra
  provider: openai                    # policy: OpenAI graders never via openrouter
  model: gpt-5.6-terra
  effort: none                        # mirror of the sol entry's convention
- grader_model: anthropic/claude-sonnet-5
  provider: anthropic
  model: claude-sonnet-5
  effort: high                        # Anthropic's own default for Sonnet 5
