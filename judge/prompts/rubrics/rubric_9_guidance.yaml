# Judge-only grading guidance for rubric_9 (Patrick, 2026-09-01).
#
# These notes change how the JUDGE applies the rubric, not what agents are
# asked to do. They are layered onto the rendered checks at prompt time by
# utils/rubric_guidance.py, identically in both v2 grading modes (12-category
# and single-pass), so mode comparisons share one standard.
#
# This file is validated against rubric_9.json at load: a note naming a
# category or check the rubric doesn't contain refuses to grade. If the
# rubric is regenerated/revised, update the names here to match.
#
# rubric_9.json itself is generated from the agent-facing build prompt —
# never fold these notes into it (they'd be wiped by regeneration and would
# leak into what agents are told).

general: |
  The starting workbook (source "starting") is the file the agent was given
  before it did any work. Never deduct points for anything that was already
  present in the starting workbook — pre-existing sheets, values, hardcodes,
  formatting, or structure are not the agent's work and must not count
  against it. When you are about to record a mistake, and it is plausible
  the offending content was inherited, check the starting workbook first;
  only penalize what the agent added or changed.

categories:
  Accuracy: |
    Judge this category with a reasonable-person standard: if a reasonable
    person comparing the attempt's answer with the golden solution's would
    conclude they are the same, treat them as the same. NEVER penalize any
    Accuracy check for formatting-related issues — how a value is displayed
    (number format, font, alignment, sign styling) is the Formatting
    category's domain, not Accuracy's.

checks:
  - category: Accuracy
    name: Final calculation accuracy
    note: |
      Formatting must have no impact on this check. A negative shown as
      (1) and one shown as -1 are the same value. An answer quoted as a
      percentage counts as correct whether or not it is multiplied by 100
      (0.42 and 42 for 42% are both correct). Compare underlying values,
      not their rendering. Two answers are THE SAME whenever the
      answer-equivalence rulebook (rendered under the Accuracy category
      standard) says so — in particular, a difference inside the requested
      rounding precision (a penny, when two decimal places were asked for)
      is NOT a mistake, and a sign flip on an expense/cost/outflow row is a
      convention, not an error. Outside those rules a different value is a
      mistake, and an answer typed as a constant instead of a live formula
      is a mistake even when the number is right.

  - category: Accuracy
    name: Deliverable completeness
    note: |
      Do not deduct points because the attempt's supporting detail or
      deliverables use fewer cells, fewer rows or columns, are more
      concise, or take a different format than the golden solution. If the
      answer to a question is correct and the attempt shows supporting
      detail for how it was derived, that is sufficient. Do not deduct for
      formatting differences here either — a zero shown as 0, 0.0, or --
      is equally sufficient.

  - category: Assumptions
    name: Unique assumptions
    note: |
      Do not subtract points for anything found on assumption pages when
      the assumptions were provided as part of the starting workbook. Only
      assumptions the agent itself introduced are in scope.

  - category: Flexibility
    name: Driver-based, formula-linked architecture
    note: |
      Do not deduct points for hardcoded cells that were already hardcoded
      in the starting workbook the agent received. Only hardcodes the agent
      itself introduced count against this check.

  - category: Formatting
    name: Reasonable number formats
    note: |
      Dates must be formatted with NO timestamp: 2027-01-01 is fine;
      2027-01-01 00:00:00 is not.

  - category: Formatting
    name: Blue font for hardcoded inputs
    note: |
      Blue font marks the model's drivers — the assumptions a user is
      expected to change to test a different scenario. Judge this on the
      cells the model presents as inputs or assumptions: an inputs or
      assumptions sheet, or a clearly labelled assumptions block, plus any
      other hardcoded value that a headline output is directly sensitive
      to. Do NOT count against the model hardcoded values that are not
      meant to be varied — labels, headers, dates in a timeline, units,
      counters, section numbers, constants inside formulas, and historical
      or actual figures presented as fact rather than as an assumption.
      If it is unclear whether a cell is a driver the user is meant to
      vary, do not treat it as a miss.

  - category: Formatting
    name: Black font for calculations
    note: |
      Do NOT deduct points when a formula that references cells on other
      sheets is formatted in green font — green is the sanctioned color
      for cross-sheet links, so either color is acceptable for such cells.

  - category: Formatting
    name: Green font for cross-sheet links
    note: |
      Do NOT deduct points when a formula that references cells on other
      sheets is formatted in black font — black is the sanctioned color
      for calculations, so either color is acceptable for such cells.

  # ---------------------------------------------------------------------
  # Repeat-grading stability notes (Pat, 2026-09-02). Added after grading
  # the same ten attempts twice with one judge (Sol@none): mean total swing
  # 5.1%, max 10.1%, and every point of it traced to judgement checks
  # flipping — never to a harness-decided check. The flips were opposite
  # readings of identical evidence ("denominator guards prevent errors" vs
  # "guards return zero, which is misleading"; "first-period exceptions are
  # not flagged" vs "there are no first-period exceptions"). Each note below
  # converts a two-way-readable check into a decision rule with a required
  # citation, so a fail has to name the cell or formula that earns it.
  # ---------------------------------------------------------------------

  - category: Potential Dangers
    name: No errors under extreme-but-plausible inputs
    note: |
      Fail ONLY when you can name a specific plausible input change AND the
      specific cell that would then show an Excel error, a balance-sheet
      imbalance, or an impossible value (negative useful life, negative
      shares outstanding). A guard that returns 0, blank, "n/a" or a
      sentinel for an invalid input is robust handling — it is a PASS, not
      a "misleading result". The absence of a stress-test section, a
      sensitivity table or documented scenario testing is NOT a failure of
      this check; it is about whether the model breaks, not whether it
      demonstrates that it doesn't.

  - category: Assumptions
    name: Single date driver
    note: |
      Pass when one labelled date cell exists and the date-dependent
      formulas use it, directly or through cells derived from it. Year or
      period LABELS in headers (FY2024, 2025, Q3-2026) are labels, not date
      logic — never fail because headers are typed rather than computed.
      A model with no date-dependent logic (no discounting, stub periods,
      roll-forwards or mid-year conventions) passes by default. Fail ONLY
      when you can cite two date-dependent formulas that rely on different
      hardcoded dates, or a date-dependent formula with a hardcoded date
      where an anchor cell exists.

  - category: Flexibility
    name: Time-period flexibility
    note: |
      Judge against the horizon the case actually asks for, not a longer
      one you can imagine. A prebuilt timeline that covers the required
      horizon, with dates driven by formulas and drivers changeable in one
      place, is a PASS — needing to add columns to go beyond the required
      horizon is not a failure. Fail ONLY when changing the start date, a
      driver, or the number of periods WITHIN the required horizon forces
      manual formula edits; cite the formula that would have to change.

  - category: Formulas
    name: No hardcoded numbers in formulas
    note: |
      Permitted constants (never a mistake): 0, 1, -1, 100, 12, 4, 3, 365,
      360, 52, 24, rounding digit counts, unit conversions, index/offset/
      counter arguments, and comparison thresholds of zero. Fail ONLY for a
      BUSINESS assumption embedded in a formula — a rate, price, growth
      percentage, margin, headcount, tax rate or similar that a user might
      reasonably want to change — and cite the cell and the constant. If
      the same number is also present as a labelled input cell elsewhere,
      it is a duplication issue for Centralized assumptions, not this check.

  - category: Assumptions
    name: Centralized assumptions
    note: |
      A clearly labelled input block held on a build, summary or output
      sheet is acceptable when it is the ONLY place that driver is set and
      it is labelled or signposted. Fail ONLY when you can cite a driver
      that is set in two different places, or a business assumption buried
      inside a formula with no labelled input cell anywhere. Do not fail
      because the block would be tidier on a dedicated sheet.

  - category: Assumptions
    name: Assumption sources
    note: |
      A citation passes when it names where the number came from — a case
      section, the starting workbook, a document, a named data provider —
      or explicitly labels the input as a judgement/estimate with an owner
      and a date. Never fail for citation STYLE: brevity, a missing page
      number, a missing URL, or a source that cannot be opened from here
      are not failures, and neither is a citation that points at the sheet
      the value was given on. Fail ONLY for an assumption carrying no
      source and no judgement label at all; cite it.

  - category: Formulas
    name: Inconsistent formulas flagged
    note: |
      First establish whether an intentional formula break EXISTS — a cell
      whose formula differs from the rest of its row or column (typically
      a first-period roll-forward). If none exists, the check PASSES; never
      fail it for a break you did not find. Where one exists, it passes if
      marked in any way: distinctive fill or font, a cell comment, an
      exception-marker column, an error-check flag, a note in adjacent
      documentation, OR a formula that handles the first period with an
      explicit period test so the row stays uniform. Fail ONLY for a silent
      break — an unmarked, undocumented different formula in one cell of an
      otherwise uniform range; cite that cell.

  - category: Formulas
    name: Simple, stepwise formulas
    note: |
      Count function NESTING DEPTH, not formula length or character count.
      A long chain of simple terms (a+b+c+d), a single IFERROR/IFNA
      wrapper, a LET, or a construction three functions deep all PASS.
      Fail ONLY for a formula nesting four or more functions deep that a
      helper row or column would clearly simplify; cite the cell and its
      formula.

  - category: Structure
    name: Data-type designation (actuals vs. estimates)
    note: |
      This applies where a single table mixes actual and forecast columns.
      A sheet or block holding only historical data, or only projections,
      passes when the header, title or an adjacent note says which it is.
      Fail ONLY when actual and projected columns sit in one table with no
      A/E marking or equivalent designation; cite the header row.

  - category: Formatting
    name: Consistent color coding
    note: |
      Judge FONT colour on the sheets the agent built, against the
      workbook's own stated convention. Fills, header shading, banded rows
      and title styling are decoration, not colour coding — never count
      them here. Colour inherited from the starting workbook is out of
      scope. Fail ONLY when you can cite cells of the same kind carrying
      different font colours, or a reserved colour used for the wrong kind
      of cell.

  - category: Formatting
    name: Minimal non-standard color usage
    note: |
      This check is about visual CLUTTER — a rainbow of unexplained
      colours. A consistent header fill, a single input-block fill, banded
      rows, and a documented accent colour used systematically are all
      fine, however many cells they cover; breadth of a consistent scheme
      is not clutter. Fail ONLY when you can name three or more distinct
      non-standard colours with no stated purpose.

  - category: Formatting
    name: No colors that mimic standard coding
    note: |
      Fails only when a RESERVED FONT colour (blue for inputs, black for
      calculations, green for cross-sheet links, red for external links)
      is applied to cells of another kind, so a reader would misread the
      cell's purpose. Background FILLS never mimic font coding — a blue
      header fill or a blue input-block fill is not a violation. Negative
      numbers shown in red font are a standard accounting convention and
      are never a violation of this check.
