# V2 PRESET — judge configured for benchmark v2 (the MBABenchV2 task set).
# The sibling file project_configs.v1.example.yaml is the v1 equivalent.
#
# To activate:  cp project_configs.v2.example.yaml project_configs.yaml
# The code loads exactly judge/project_configs.yaml — no other name works.
#
# v2 = rubric_9 (12 categories / 132 checks, generated byte-exact from the
# v2 build prompt by operation_scripts/build_rubric_9_from_prompt.py) +
# rubric_9_weights. v2 grading MUST run through the agentic judge — always
# pass --agentic; the standard path is hardcoded to 3 categories and refuses
# rubric_9. DATABASE_URL (in judge/.env) must be the MBABenchV2 connection
# string — validate_benchmark_coherence (main_scripts/grade_from_db.py)
# aborts on any v1/v2 mix before any DB or S3 write.
# JUDGE_SKIP_BENCHMARK_GUARD=1 bypasses (one-off experiments only).

project:
  name: "BizbenchJudge" # Used for logging and ENV var prefixing.

keys:
  # All null on purpose — secrets live in judge/.env (copy judge/.env.example)
  # and are exported by `source project_configs.sh`.
  open_router_api_key: null
  database_url: null
  old_database_url: null
  anthropic_key: null
  gemini_key: ""

paths:
  scratch_path: null        # from SCRATCH_PATH env (set by project_configs.sh)
  libreoffice_path: null    # from LIBREOFFICE_PATH env (set by project_configs.sh)

miscs:
  logger_name: "bizbench_judge"
  log_to_terminal: true

judge:
  # Main judge version. Increment on significant changes to the judging
  # process (prompt template, rubric, or grading logic) — used to track which
  # gradings correspond to which judge configuration.
  version: 5

  prompt_template: "prompts/judge_template_7_0.yaml"
  prompt_version: "7.0"

  # ---- v2 rubric pair ----
  rubric: "prompts/rubrics/rubric_9.json"
  rubric_version: "9"
  rubric_weight: "prompts/rubrics/rubric_9_weights.json"
  rubric_weight_version: "9"
  rubric_max_mistakes: 1

  do_rounding: true
  float_rounding: 6
  percentage_rounding: 8
  fast_cell_extract: true

  # Per-call trajectory recording (utils/trajectory.py) — uploaded with the
  # grading; validate with operation_scripts/validate_judge_trajectory.py.
  record_trajectory: true

  # The judge-study workhorse. project_configs.sh pins this slug through
  # OpenRouter (JUDGE_OPENROUTER_MODELS) — extend that export if you
  # override --model to a different google/* slug.
  openrouter_model: "google/gemini-2.5-pro"

  # ---- v2 category order (must match rubric_9's 12 categories exactly) ----
  check_order: "Accuracy,Assumptions,Documentation,Error Checks,Flexibility,Formatting,Formulas,Model Outputs & Executive Summary,Potential Dangers,Purpose & Scope,Rounding,Structure"

  default_total_character_limit: 2_000_000
  default_solution_context_char_limit: 1_000_000
  default_attempt_context_char_limit: 1_000_000

agentic_judge:
  version: 2
  prompt_template: "prompts/agentic_judge_template_4.yaml"
  prompt_version: "4"
  # 850k (not 1M): below GPT-5.6 Sol's real 922k input cap so context
  # eviction fires before a 400 (judge-study lesson, 2026-08).
  context_token_limit: 850000
  max_rounds: 50
  # 2500 (not 5000): drop to ~1200 for stubborn overflow cells.
  read_file_max_cells: 2500

s3:
  # Grading artifacts (judge_results/ contents) upload to:
  #   s3://{raw_files_bucket}/{raw_files_prefix}/{timestamp}_{uuid}/
  # ---- v2 grading destination ----
  raw_files_bucket: "mbabench"
  raw_files_prefix: "MBABenchV2/grading"
