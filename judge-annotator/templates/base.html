<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judge Annotator</title>
<style>
 body{font-family:-apple-system,Segoe UI,sans-serif;margin:0;background:#f6f7f9;color:#1a1a2e}
 header{background:#1a2744;color:#fff;padding:10px 24px;display:flex;justify-content:space-between;align-items:center}
 header a{color:#9fb6e8;text-decoration:none;margin-left:16px}
 main{max-width:1100px;margin:24px auto;padding:0 16px}
 table{border-collapse:collapse;width:100%;background:#fff;font-size:14px}
 th,td{padding:7px 10px;border-bottom:1px solid #e3e6ec;text-align:left}
 th{background:#eef1f6;position:sticky;top:0}
 tr:hover td{background:#f0f4fb}
 .btn{background:#2456b3;color:#fff;border:0;padding:7px 16px;border-radius:5px;cursor:pointer;text-decoration:none;font-size:14px;display:inline-block}
 .btn-sm{padding:3px 10px;font-size:13px}
 .pill{border-radius:10px;padding:1px 8px;font-size:12px}
 .pass{background:#d9f2e0;color:#186a35}.fail{background:#fbdcdc;color:#9c1f1f}
 .card{background:#fff;border:1px solid #e3e6ec;border-radius:8px;padding:16px;margin-bottom:16px}
 select,input[type=text],input[type=password]{padding:6px 8px;border:1px solid #c6ccd8;border-radius:5px;font-size:14px}
 .note-in{width:95%}
 .muted{color:#68708a;font-size:13px}
 .mistake{background:#fdf3f3;border-left:3px solid #d66;margin:5px 0;padding:5px 9px;font-size:13px}
 .checkrow{border-top:1px solid #edf0f5;padding:11px 0}
 label.opt{margin-right:18px;cursor:pointer}
</style></head>
<body>
<header>
 <div><strong>Judge Annotator</strong></div>
 <div>{% if user %}{{ user }} <a href="/">Browse</a> <a href="/logout">Log out</a>{% endif %}</div>
</header>
<main>{% block content %}{% endblock %}</main>
</body></html>
