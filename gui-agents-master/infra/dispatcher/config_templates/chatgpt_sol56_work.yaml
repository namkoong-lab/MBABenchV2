# Spin-up config template: ChatGPT provider, GPT-5.6 Sol on the Work surface.
#
# Pass to spinup.sh via:
#   dispatch spinup \
#       --alias chatgpt-sol56-work-1 \
#       --config-template infra/dispatcher/config_templates/chatgpt_sol56_work.yaml
#
# Deep-merges on top of infra/configs/configs.default.yaml; every key here
# is an override. DB URL and AWS creds intentionally absent — spinup.sh
# synthesizes /etc/gui-agents/secrets.env from the operator's env, and the
# worker reads those via the EnvironmentFile in gui-agents-worker.service.
#
# Identity resolves to chatgpt_gpt_5_6_sol_work_ultra (see agent_identity.py).

benchmark: v2

provider:
  kind: "chatgpt"

# 201 = the single-pass v2 prompt (tasks_configs/prompts/v2_1.txt).
prompt_version: 201

# Every axis a box's output depends on is pinned here rather than inherited.
# The v2 ChatGPT work identity keys on (mode, model, effort, speed), so a
# moved default here does not quietly redefine the
# chatgpt_gpt_5_6_sol_work_ultra cohort — it fails to resolve instead.
chatgpt_web:
  mode: "work"
  model: "gpt_5_6_sol"
  # Work-mode pickers (pill menu > Advanced). "ultra" is the ceiling
  # (light < medium < high < xhigh < max < ultra); matches the v1 Sol work wave.
  effort: "ultra"
  speed: "standard"
  # MUST stay null: intelligence is the chat-mode radio set. Setting it here
  # is a hard preflight error under benchmark v1 and a warning under v2.
  intelligence: null
  # null = no project scope: the box starts at the chatgpt.com homepage and
  # its chats land in the account's main history. A project id belongs to ONE
  # account and silently redirects to the homepage in any other, so pin one
  # only if it exists in the account this box logs into (VNC step).
  project_id: null
  project_slug: null
  browser:
    # Matches the path the README's VNC-login step writes cookies into.
    profile_dir: "/var/lib/gui-agents/chrome-chatgpt"

# Production boxes pull from the MBABenchV2 Postgres DB and write attempts to S3.
source:
  kind: "postgres_s3"
  schema: "mbabenchv2"
  filters:
    skip_deprecated: true
    skip_already_attempted: true

sink:
  kind: "postgres_s3"
  schema: "mbabenchv2"
