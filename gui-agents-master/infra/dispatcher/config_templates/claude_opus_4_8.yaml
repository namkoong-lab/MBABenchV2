# Spin-up config template: Claude provider, Opus 4.8 at max effort with
# Extended Thinking on.
#
# Pass to spinup.sh via:
#   dispatch spinup \
#       --alias claude-opus48-1 \
#       --config-template infra/dispatcher/config_templates/claude_opus_4_8.yaml
#
# Deep-merges on top of infra/configs/configs.default.yaml; every key here is an
# override. DB URL and AWS creds intentionally absent - spinup.sh synthesizes
# /etc/gui-agents/secrets.env from the operator's env, read by the worker via
# the EnvironmentFile in gui-agents-worker.service.
#
# Identity resolves to claude_opus_4_8_max (see infra/configs/agent_identity.py).

benchmark: v2

provider:
  kind: "claude"

# 201 = the single-pass v2 prompt (tasks_configs/prompts/v2_1.txt).
prompt_version: 201

# Every axis a box's output depends on is pinned here rather than inherited.
# The v2 Claude identity keys on (mode, model, effort); the two capability
# toggles below change what these boxes send without changing the DB label —
# a moved default would silently redefine the claude_opus_4_8_max cohort.
claude_web:
  mode: "chat"
  model: "opus_4_8"
  # Highest tier (low < medium < high < xhigh < max).
  effort: "max"
  # The composer's thinking switch, which the Opus family exposes.
  enable_extended_thinking: true
  # Off: the tasks are self-contained, and a search changes what the model
  # sees between attempts.
  enable_web_search: false
  # project_id must exist in the claude.ai account this box logs into (VNC step).
  # Paste from https://claude.ai/project/{project_id}. null = default chat.
  project_id: "019ef001-4c2c-76da-8c87-c94067ba216b"
  browser:
    # Matches the path the README's VNC-login step writes the Chrome profile to.
    profile_dir: "/var/lib/gui-agents/chrome-claude"

# Production boxes pull from the MBABenchV2 Postgres DB and write attempts to S3.
source:
  kind: "postgres_s3"
  schema: "mbabenchv2"
  filters:
    skip_deprecated: true
    skip_already_attempted: true

sink:
  kind: "postgres_s3"
  schema: "mbabenchv2"
