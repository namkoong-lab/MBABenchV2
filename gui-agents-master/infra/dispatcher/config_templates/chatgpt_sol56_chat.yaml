# Spin-up config template: ChatGPT provider, GPT-5.6 Sol on the Chat surface.
#
# Pass to spinup.sh via:
#   dispatch spinup \
#       --alias chatgpt-sol56-chat-1 \
#       --config-template infra/dispatcher/config_templates/chatgpt_sol56_chat.yaml
#
# Deep-merges on top of infra/configs/configs.default.yaml; every key here
# is an override. DB URL and AWS creds intentionally absent — spinup.sh
# synthesizes /etc/gui-agents/secrets.env from the operator's env, and the
# worker reads those via the EnvironmentFile in gui-agents-worker.service.

benchmark: v2

provider:
  kind: "chatgpt"

# 203 = the single-pass v2 prompt + Questions-sheet answers
# (tasks_configs/prompts/v2_2.txt).
prompt_version: 203

# Every axis a box's output depends on is pinned here rather than inherited.
# The v2 ChatGPT chat identity keys on (mode, model, intelligence), so all
# three are named — a moved default would silently redefine the cohort.
chatgpt_web:
  mode: "chat"
  # The model itself, from the pill's nested submenu (label "GPT-5.6 Sol").
  # NOT model: "pro" — that is a one-axis value naming an intelligence level,
  # which the agent routes to `intelligence` and which leaves the model at
  # whatever the session last used (verified live 2026-08-21).
  model: "gpt_5_6_sol"
  # Chat's reasoning tier, the pill's top-level radios (the UI renamed these
  # "Effort" 2026-08-12). Ceiling: instant < medium < high < xhigh < pro.
  intelligence: "pro"
  # Work-mode pickers. Null in chat mode, or preflight rejects the config.
  effort: null
  speed: null
  # null = no project scope: the box starts at the chatgpt.com homepage and
  # its chats land in the account's main history. A project id belongs to ONE
  # account and silently redirects to the homepage in any other, so pin one
  # only if it exists in the account this box logs into (VNC step).
  project_id: null
  project_slug: null
  browser:
    # Matches the path the README's VNC-login step writes cookies into.
    profile_dir: "/var/lib/gui-agents/chrome-chatgpt"

# Production boxes pull from the MBABenchV2 Postgres DB and write attempts to S3.
source:
  kind: "postgres_s3"
  schema: "mbabenchv2"
  filters:
    skip_deprecated: true
    skip_already_attempted: true

sink:
  kind: "postgres_s3"
  schema: "mbabenchv2"
