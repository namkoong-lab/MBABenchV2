# benchmark v1 — SpreadsheetSmith V1 wave (SpreadsheetSmithV1 DB) — ChatGPT track example.
#
#   python -m infra.run --run-config \
#     infra/configs/run_configs/spreadsheetsmithv1_run_examples/sample_spreadsheetsmithv1_chatgpt.yaml --dry-run
#
# v1 ChatGPT runs use WORK mode (pill > Advanced: effort + speed). With the
# values below the DB identity resolves to chatgpt_web_work_gpt5.6_sol_ultra.
# Real production configs (live project ids/ports) stay out of git.

benchmark: v1

source:
  kind: postgres_s3
  schema: spreadsheetsmithv1
  filters:
    task_ids: [7]
    task_sources: ["fmwc", "modeloff", "wsp"]
    skip_deprecated: true
    skip_already_attempted: true

sink:
  kind: postgres_s3
  schema: spreadsheetsmithv1

provider:
  kind: "chatgpt"

# 9 = the single pv9 payload used on the whole v1 wave. The registry resolves
# it to tasks_configs/prompts_pv9/SHARED_pv9_prompt.txt.
prompt_version: 9

chatgpt_web:
  project_id: "your-chatgpt-project-id"
  mode: "work"
  model: "gpt_5_6_sol"
  effort: "ultra"
  speed: "standard"
  intelligence: null
  browser:
    cdp_port: 9226
    profile_dir: "browser_profiles/chrome-chatgpt"
