# TUTORIAL EXAMPLE — benchmark v1, Claude Fable 5 in Cowork mode.
# DB identity resolves to: claude_web_cowork_fable5_max
# Same shape as bizbenchv1_run_examples/sample_bizbenchv1_claude.yaml.
#
# Run (from gui-agents-master/, Chrome already running + logged in):
#   python -m infra.run --run-config \
#     infra/configs/run_configs/v1_fable5_claude_cowork.yaml --dry-run
# Then drop --dry-run and add -y to run for real.

benchmark: v1

source:
  kind: postgres_s3
  schema: bizbench                   # v1 = BizbenchV1 DB + s3://mbabench/BizbenchV1/
  filters:
    task_ids: [330]                  # replace with yours
    task_sources: ["fmwc", "modeloff", "wsp"]
    skip_deprecated: true
    skip_already_attempted: true     # rerunning this config skips tasks already done

sink:
  kind: postgres_s3
  schema: bizbench

provider:
  kind: "claude"

# 9 = the single-prompt v1 payload (tasks_configs/prompts_pv9/).
prompt_version: 9

claude_web:
  project_id: "your-claude-project-id"  # from https://claude.ai/project/{id}; must exist in the account logged into this Chrome
  mode: "cowork"                     # the "cowork" agent surface (vs "chat")
  cowork_approval: "auto"            # never "manual" for unattended runs
  model: "fable_5"
  effort: "max"
  browser:
    cdp_port: 9223                   # the runner auto-launches Chrome on 9222 only; any other port: start Chrome yourself
    profile_dir: "browser_profiles/chrome-claude"
