# ============================================================================
# gui-agents infra — default config schema.
#
# This file defines EVERY configurable knob and its default.
# To override anything, create a sibling `configs.yaml` (gitignored) and set
# only the keys you want to change. Per-task YAMLs in `task_configs/` can also
# deep-merge overrides scoped to a single task.
#
# Merge order (later wins):
#   1. configs.default.yaml       (this file)
#   2. configs.yaml               (user global overrides)
#   3. task_configs/<task>.yaml   (task-level overrides, per task only)
#
# Leaf form: each concrete setting is a dict with two keys:
#     value:    the default (or "" / [] / null if none)
#     required: true  -> must be truthy after merge, else ConfigError
#               false -> may be empty; callers decide when it's needed
#
# Override form: in configs.yaml and task YAMLs you may use EITHER the full
# `{value: ...}` form or a raw scalar/list:
#     source:
#       kind: "postgres_s3"           # raw — shorthand
#       kind: {value: "postgres_s3"}  # full form — same effect
# ============================================================================


# ---- Which benchmark this run belongs to -----------------------------------
# The repo drives two experiments with different task sets, DBs, prompt sets,
# grading rubrics, and DB label conventions. Every run must know which one it
# is; the value gates identity resolution (agent_identity.py), source/sink
# schema validation (task_io/registry.py), and provider preflight (run.py).
#   v1 — MBABench V1 wave: BizbenchV1 DB (schema "bizbench"), s3://mbabench/
#        BizbenchV1/attempts, single-prompt pv9 payloads
#        (tasks_configs/prompts_pv9/), mode/effort-rich identities.
#   v2 — MBABenchV2 task set: MBABenchV2 DB (schema "mbabenchv2"),
#        s3://mbabench/MBABenchV2/attempts, 3-step rubric-v9 prompts
#        (tasks_configs/prompts_v2/), model-only identities.
benchmark:
  value: "v2"                # "v1" | "v2"
  required: true


# ---- Which provider / agent is running -------------------------------------
provider:
  kind:
    value: "claude"          # "claude" | "chatgpt"
    required: true


# ---- Agent identity --------------------------------------------------------
# `model_name`, `agent_folder`, and `agent_model_type` are derived from the
# provider block below by infra/configs/agent_identity.py, so the DB label
# cannot disagree with what the run did. `prompt_version` stays
# operator-controlled — it is independent of any behavior field.
agent:
  # DERIVED — leave null. The run's prompt version is the top-level
  # `prompt_version`, which both selects the prompt files and is written to
  # task_attempts.prompt_version; run.py copies it here before building the
  # sink. A run config may set this key, in which case it must match the
  # top-level value — a mismatch is refused, since it would record a row
  # under a version the agent was never sent.
  prompt_version:
    value: null
    required: false


# ---- Where task files land on disk -----------------------------------------
paths:
  # Downloaded starting_files land here, as does `attempts/`, where each
  # attempt gets a working directory for the engine's solutions/, json_logs/
  # and logs/. That directory is deleted once the sink has uploaded its
  # contents, so nothing under here is a lasting record.
  scratch_dir:
    value: "scratch/gui-agents"
    required: true
  # THE run output. Local mirror of everything the postgres_s3 sink uploads
  # — workbook, completion JSONs, chat transcript, runtime log, prompts JSON
  # — laid out under the same relative path as the S3 key, e.g.
  #   outputs/MBABenchV2/attempts/claude_haiku_4_5/BasicGrowth/{ts}_{run_id}/
  # so the folder on disk can be diffed against the bucket by eye. Copies are
  # best-effort — a mirror failure warns and the run continues, since S3 is
  # the record of truth. Set to "" to disable mirroring. (The `local` sink's
  # own ndjson path is sink.output_dir, not this key.)
  output_dir:
    value: "outputs"
    required: false
  venv_path:
    value: ""                     # override if the runner shells out
    required: false


# ---- Task source (where tasks come from) -----------------------------------
source:
  kind:
    value: "yaml"            # "yaml" | "postgres_s3"
    required: true

  # REQUIRED when kind == "postgres_s3": picks the concrete schema wiring.
  # "bizbench" (BizbenchPostgresS3TaskSource, benchmark v1) or "mbabenchv2"
  # (MBABenchV2PostgresS3TaskSource, benchmark v2) — must match `benchmark`
  # above (enforced at build time). Must be null/omitted for kinds that
  # don't use it (e.g. "yaml").
  schema:
    value: null              # null | "bizbench" | "mbabenchv2"
    required: false

  # Used when kind == "yaml". Either a single file with a `tasks:` list, or a
  # folder whose *.yaml files are each loaded (one task per file is typical).
  yaml_path:
    value: "infra/configs/task_configs"
    required: false

  # Used when kind == "postgres_s3"
  filters:
    task_ids:
      value: []              # [] = no filter
      required: false
    task_sources:
      value: []              # e.g. ["modeloff"]
      required: false
    skip_deprecated:
      value: true
      required: false
    skip_already_attempted:
      value: true             # skip tasks that already have a non-failed
                              # attempt from this agent at this prompt_version
      required: false


# ---- Attempt sink (where results go) ---------------------------------------
sink:
  kind:
    value: "local"           # "local" | "postgres_s3"
    required: true

  # REQUIRED when kind == "postgres_s3": picks the concrete schema wiring.
  # "bizbench" (benchmark v1, Hive-style S3 keys) or "mbabenchv2" (benchmark
  # v2, task-name S3 keys) — must match `benchmark` above (enforced at build
  # time). Must be null/omitted for kinds that don't use it (e.g. "local").
  schema:
    value: null              # null | "bizbench" | "mbabenchv2"
    required: false

  # Used when kind == "local"
  output_dir:
    value: "outputs"
    required: false


# ---- Database --------------------------------------------------------------
# NORMALLY LEAVE `url` EMPTY. The connection string comes from the monorepo
# config at <repo>/config/config.yaml, which holds both databases side by
# side and is selected by the `benchmark` key at the top of this file:
#
#     database:
#       v1_url: "...neon.tech/BizbenchV1?..."     <- benchmark: v1
#       v2_url: "...neon.tech/MBABenchV2?..."     <- benchmark: v2
#
# That is what makes "v2 run recorded into the v1 DB" impossible: the run
# config picks the benchmark and the database together, or neither.
#
# Resolution order (task_io/registry.py), first hit wins:
#   1. `url` below — an explicit override. On EC2 boxes this whole file is
#      the pushed run profile, so the escape hatch stays available.
#   2. <repo>/config/config.yaml -> database.v{1,2}_url  (benchmark-selected)
#   3. the env var named by `url_env`. This is the box path: spinup.sh writes
#      /etc/gui-agents/secrets.env and boxes never see the monorepo config.
#      NOTE it is a single blind url — it cannot tell v1 from v2.
database:
  url:
    value: ""
    required: false
  url_env:
    value: "MBABENCHV2JUDGE_KEYS_DATABASE_URL"
    required: false


# ---- AWS / S3 --------------------------------------------------------------
# Same three layers as `database` above:
#   1. `access_key_id` / `secret_access_key` below (explicit override)
#   2. <repo>/config/config.yaml -> aws.access_key_id / aws.secret_access_key
#   3. the env vars named by the `*_env` keys (the box path)
# `session_token` has no monorepo equivalent — layers 1 and 3 only.
# If nothing resolves, the postgres_s3 source/sink RAISE rather than falling
# through to boto3's default credential chain: a benchmark run must not
# silently pick up whichever AWS identity happens to be ambient.
aws:
  region:
    value: "us-east-1"
    required: false
  access_key_id:
    value: ""
    required: false
  access_key_id_env:
    value: "AWS_ACCESS_KEY_ID"
    required: false
  secret_access_key:
    value: ""
    required: false
  secret_access_key_env:
    value: "AWS_SECRET_ACCESS_KEY"
    required: false
  session_token:
    value: ""
    required: false
  session_token_env:
    value: "AWS_SESSION_TOKEN"
    required: false
  # null = derived from the sink schema at build time (task_io/registry.py):
  #   bizbench   -> bucket "mbabench",  prefix "BizbenchV1/attempts"
  #   mbabenchv2 -> bucket "mbabench",  prefix "MBABenchV2/attempts"
  # Set explicitly only to redirect a run to a non-standard bucket/prefix.
  s3_bucket:
    value: null
    required: false
  s3_prefix:
    value: null
    required: false


# ---- Poll loop (Phase 4+) --------------------------------------------------
poll:
  interval_seconds:
    value: 60
    required: false
  max_idle_seconds:
    value: 3600              # runner exits after this long with no work
    required: false


# ============================================================================
# Engine inputs (everything from here down is assembled into the dict passed
# to the engine subprocess, once per task, by infra/run.py).
#
# `build_engine_config(cfg, spec)` does:
#   1. Start with the full nested cfg dict (project-wide).
#   2. Deep-merge per-task overrides on top (layer 3).
#   3. Select the active provider block (claude_web / chatgpt_web) and
#      assemble: {agent_type, prompts, prompt_version, local_files_base,
#                 task_name, task_id, upload_files, solution_name,
#                 <provider>_web: {...}}.
#
# Rule: no placeholder defaults. Every default here is either a real working
# value or `null` where null has an unambiguous meaning in the agent code.
# The runner's preflight will exit(2) before touching the browser if anything
# ends up empty/placeholder for the active provider.
# ============================================================================


# ---- Shared (both providers) -----------------------------------------------
# Selects the prompt file(s) for this run from
# tasks_configs/prompts/registry.yaml, AND is written to
# task_attempts.prompt_version — one key, so the DB label and the text the
# agent receives cannot disagree. Registered versions:
#
#     0    000 pipeline smoke test   (no modeling — copy workbook + add a
#                                    "TEST SHEET"; throwaway rows, never grade)
#     9    pv9 single prompt         (17-check rubric, 1 turn)
#   200    rubric-v9 3-step          (132-check rubric, 3 turns)
#   201    rubric-v9 single-pass     (132-check rubric, 1 turn)
#
# Default 200 = exactly the files this repo has always sent by default,
# under a number that identifies only them.
# Must equal agent.prompt_version if that is also set; run.py refuses a
# mismatch rather than picking one.
prompt_version:
  value: 200
  required: false

# Empty = let the engine resolve paths from CWD. Set to the directory
# your per-task upload_files are relative to.
local_files_base:
  value: ""
  required: false


# ---- Claude provider block (passed as engine_config["claude_web"]) ---------
claude_web:
  # null = use the default Claude.ai chat (no project scope). Paste a real
  # project_id (from https://claude.ai/project/{id}) to pin runs to a project.
  project_id:
    value: null
    required: false
  # Surface mode: "chat" | "cowork". Selection persists across sessions; the
  # agent asserts it every task. Bifurcates the DB identity in both benchmarks.
  mode:
    value: "chat"
    required: false
  # Cowork action approvals: manual | auto | skip (null = auto). "manual"
  # pauses for every action and stalls unattended runs. Cowork mode only.
  cowork_approval:
    value: "auto"
    required: false
  # Model config value → claude.ai dropdown label (see MODEL_LABELS in
  # claude_web_agent.py). null crashes the agent at model-selector time —
  # DO NOT leave null; benchmark runs must pin it for the DB identity.
  model:
    value: "opus_4_8"          # opus_5 | fable_5 | sonnet_5 | haiku_4_5 |
                               # opus_4_8 | opus_4_7 | opus_4_6 | opus_3 |
                               # sonnet_4_6
    required: false
  # Reasoning effort via the model dropdown's Effort submenu
  # (low | medium | high | xhigh | max; xhigh renders as "Extra" in the UI).
  # Sonnet/opus also get the nested "Thinking" toggle enabled; fable's
  # Effort submenu has no Thinking toggle. Haiku has no effort control and
  # ignores this. null = keep the session's current level. Bifurcates the
  # DB identity in both benchmarks (haiku's label omits it — no control).
  effort:
    value: "max"
    required: false
  # Desired state of the composer's thinking switch. Applied only for models
  # that expose it (opus family); a successful no-op for models that don't
  # (fable_5, haiku_4_5).
  enable_extended_thinking:
    value: true
    required: false
  # Web Search capability in the composer's tools menu. Off for benchmark
  # runs — the tasks are self-contained and a search changes what the model
  # sees between attempts.
  enable_web_search:
    value: false
    required: false
  max_sec_per_task:
    value: 7200                # 2h
    required: false
  check_interval_seconds:
    value: 2
    required: false
  max_wait_per_prompt_seconds:
    value: 7200
    required: false

  retry:
    max_agent_attempts:
      value: 3
      required: false
    max_total_attempts:
      value: 10
      required: false
    max_sec_per_task:
      value: 7200
      required: false
    max_sec_per_attempt:
      value: 7200
      required: false
    sleep_between_retries:
      value: 5
      required: false

  # STANDALONE ONLY. `python -m infra.run` gives the engine one working
  # directory per attempt under paths.scratch_dir and deletes it once the
  # sink has the files, so these apply only to a direct
  # `claude_web_engine.py --config` invocation.
  output:
    base_dir:
      value: "."
      required: false
    folder_prefix:
      value: "claudeGUI"
      required: false

  browser:
    type:
      value: "chrome"
      required: false
    headless:
      value: false
      required: false
    timeout:
      value: 30000
      required: false
    cdp_port:
      value: 9222
      required: false
    # Chrome --user-data-dir, holding the claude.ai login. A relative path is
    # resolved against the repo root, so this lives under the (gitignored)
    # browser_profiles/ tree.
    # Must match the --user-data-dir flag used when launching Chrome manually
    # (see README quickstart). EC2 templates override this to
    # /var/lib/gui-agents/chrome-claude for the VNC-login step.
    profile_dir:
      value: "browser_profiles/chrome-claude"
      required: false

  logging:
    level:
      value: "INFO"
      required: false
    save_to_file:
      value: true
      required: false
    # STANDALONE ONLY — see `output` above. Under infra.run the runtime log
    # and the chat transcript go to the attempt's own directory.
    log_directory:
      value: "claude_web_logs"
      required: false

  runtime:
    no_hold:
      value: true
      required: false


# ---- ChatGPT provider block (passed as engine_config["chatgpt_web"]) -------
chatgpt_web:
  # null = start at the chatgpt.com homepage (no project scope; chats land
  # in the account's main history — the agent logs a warning). To pin runs
  # to a project, copy the id from
  # https://chatgpt.com/g/g-p-{project_id}-{slug}/project.
  project_id:
    value: null
    required: false
  project_slug:
    value: null
    required: false
  # Model (the nested submenu of the composer pill). null is valid (uses
  # the current session default; benchmark-v1 runs must pin it).
  # v1 chat-mode values: gpt_5_6_sol | gpt_5_5 | gpt_5_4 | gpt_5_3 | o3
  # v1 work-mode values: gpt_5_6_sol | gpt_5_6_terra | gpt_5_6_luna | gpt_5_5
  # One-axis values (instant | thinking | pro) name an intelligence level
  # rather than a model; the agent routes them to `intelligence`. They stay
  # valid so the cohorts already in task_attempts under those labels can be
  # reproduced — a new run should name a model and set `intelligence`.
  model:
    value: "gpt_5_6_sol"
    required: false
  # Surface mode: "chat" | "work". Selection persists across sessions; the
  # agent asserts it every task. Bifurcates the DB identity in both benchmarks
  # (it also picks which reasoning axes apply: intelligence vs effort+speed).
  mode:
    value: "chat"
    required: false
  # WORK-mode picker (pill menu > Advanced): effort + speed. Must be null
  # in chat mode. Bifurcate the work-mode DB identity in both benchmarks.
  effort:
    value: null                # light | medium | high | xhigh | max | ultra | null
    required: false
  speed:
    value: null                # standard | fast | null (null = standard)
    required: false
  # CHAT-mode intelligence axis (the pill's top-level radios). Must be
  # null when mode == "work". Bifurcates the chat-mode DB identity in both
  # benchmarks.
  intelligence:
    value: null                # instant | medium | high | xhigh | pro | null
    required: false
  max_sec_per_task:
    value: 7200                # 2h
    required: false
  check_interval_seconds:
    value: 3
    required: false
  max_wait_per_prompt_seconds:
    value: 7200                # 2h
    required: false

  retry:
    max_agent_attempts:
      value: 3
      required: false
    max_total_attempts:
      value: 10
      required: false
    # Per-attempt ceiling. Matches max_sec_per_task (the engine guard takes
    # min() of the two) so a legitimately slow Extended Pro attempt (90-120
    # min is normal) runs to natural completion instead of being killed at
    # 90 min and restarted from scratch in a new chat.
    max_sec_per_attempt:
      value: 7200
      required: false
    sleep_between_retries:
      value: 5
      required: false

  # STANDALONE ONLY. `python -m infra.run` gives the engine one working
  # directory per attempt under paths.scratch_dir and deletes it once the
  # sink has the files, so these apply only to a direct
  # `claude_web_engine.py --config` invocation.
  output:
    folder_prefix:
      value: "chatgptGUI"
      required: false

  browser:
    type:
      value: "chrome"
      required: false
    headless:
      value: false
      required: false
    timeout:
      value: 30000
      required: false
    cdp_port:
      value: 9222
      required: false
    # Chrome --user-data-dir, holding the chatgpt.com login. A relative path is
    # resolved against the repo root, so this lives under the (gitignored)
    # browser_profiles/ tree rather than in $HOME. Must match the
    # --user-data-dir flag used when launching Chrome manually (see README
    # quickstart). EC2 templates override this to
    # /var/lib/gui-agents/chrome-chatgpt for the VNC-login step.
    profile_dir:
      value: "browser_profiles/chrome-chatgpt"
      required: false

  # `session.agent_name` is not a config key: run.py sets it from the resolved
  # agent identity, so the solution filename names the model that produced it.

  logging:
    level:
      value: "INFO"
      required: false
    save_to_file:
      value: true
      required: false
    # STANDALONE ONLY — see `output` above. Under infra.run the runtime log
    # and the chat transcript go to the attempt's own directory.
    log_directory:
      value: "chatgpt_web_logs"
      required: false

  runtime:
    no_hold:
      value: true
      required: false
